{% extends "base.html" %}
{% block title %}登录 · 匿名投票系统{% endblock %}
{% block content %}
<h1 class="page-title">登录</h1>
<div class="card" style="max-width:460px;margin:0 auto;">
  <form method="post">
    <label>真实姓名</label>
    <input type="text" name="real_name" required autocomplete="username" placeholder="请输入你注册时的真实姓名">

    <label>密码</label>
    <input type="password" name="password" required autocomplete="current-password">

    <div class="mt"><button class="btn" type="submit">登录</button></div>
    <p class="small muted mt">还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
  </form>
</div>
{% endblock %}
