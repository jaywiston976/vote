{% extends "base.html" %}
{% block title %}发起投票 · 匿名投票系统{% endblock %}
{% block content %}
<h1 class="page-title">发起投票</h1>
<div class="card">
  <form method="post" enctype="multipart/form-data">
    <label>投票标题</label>
    <input type="text" name="title" required placeholder="例如：2026 年度优秀班干部评选">

    <label>投票说明 <span class="hint">（可选）</span></label>
    <textarea name="description" placeholder="补充说明……"></textarea>

    <hr class="divider">

    <label>投票选项 <span class="hint">（自定义名称与数量，至少 2 个）</span></label>
    <div id="options-wrap">
      <div class="option-item">
        <input type="text" name="options" placeholder="选项 1">
        <button type="button" class="btn secondary sm" onclick="removeOption(this)">删除</button>
      </div>
      <div class="option-item">
        <input type="text" name="options" placeholder="选项 2">
        <button type="button" class="btn secondary sm" onclick="removeOption(this)">删除</button>
      </div>
    </div>
    <button type="button" class="btn secondary sm" onclick="addOption()">＋ 添加选项</button>

    <hr class="divider">

    <label>每人拥有的票数 <span class="hint">（必须投满，且必须投给不同的人）</span></label>
    <input type="number" name="votes_per_voter" id="votes-per-voter" min="1" max="100" value="1" style="max-width:160px;">
    <p class="small muted" id="quota-tip"></p>

    <div class="row mt">
      <label style="margin:0;">
        <input type="checkbox" name="allow_abstain" style="width:auto;"> 允许「弃票」
        <span class="hint">（选弃票的投票者将一票都不投）</span>
      </label>
    </div>

    <label class="mt">投票者能否投给自己？</label>
    <div class="row">
      <label style="margin:0;font-weight:400;">
        <input type="radio" name="allow_self_vote" value="no" checked style="width:auto;"> 否（默认）
      </label>
      <label style="margin:0;font-weight:400;">
        <input type="radio" name="allow_self_vote" value="yes" style="width:auto;"> 能
      </label>
    </div>
    <p class="small muted">选择「否」时，选项名与本人真实姓名一致的选项会自动从该用户的投票页消失，保证投不到自己。</p>

    <hr class="divider">

    <label>投票者名单 <span class="hint">（发起人不计入名单，无法参与投票）</span></label>
    <textarea name="voter_names" placeholder="每行一个姓名，或用逗号 / 顿号分隔。例如：&#10;张三&#10;李四&#10;王五"></textarea>

    <label class="mt">或导入 Excel / CSV 名单 <span class="hint">（取第一列姓名）</span></label>
    <input type="file" name="voter_file" accept=".xlsx,.xls,.csv,image/*">
    <p class="small muted">支持 .xlsx / .xls / .csv 自动读取；图片名单请手动录入到上方文本框。名单按<b>真实姓名</b>匹配注册用户。</p>

    <div class="mt"><button class="btn" type="submit">创建投票</button></div>
  </form>
</div>

<script>
let count = 2;
function addOption() {
  count++;
  const wrap = document.getElementById('options-wrap');
  const div = document.createElement('div');
  div.className = 'option-item';
  div.innerHTML = '<input type="text" name="options" placeholder="选项 ' + count + '">' +
    '<button type="button" class="btn secondary sm" onclick="removeOption(this)">删除</button>';
  wrap.appendChild(div);
  updateQuotaTip();
}
function removeOption(btn) {
  const wrap = document.getElementById('options-wrap');
  if (wrap.children.length <= 2) { alert('至少保留 2 个选项'); return; }
  btn.parentElement.remove();
  updateQuotaTip();
}

// 实时提示：当前选项数下，每人票数最多能设多少
function updateQuotaTip() {
  const wrap = document.getElementById('options-wrap');
  const inputs = wrap.querySelectorAll('input[name=options]');
  let n = 0;
  inputs.forEach(i => { if (i.value.trim()) n++; });
  const selfVote = (document.querySelector('input[name=allow_self_vote]:checked') || {}).value === 'yes';
  const capacity = Math.max(n - (selfVote ? 0 : 1), 0);
  const q = parseInt(document.getElementById('votes-per-voter').value || '1', 10) || 1;
  const tip = document.getElementById('quota-tip');
  tip.textContent = '当前已填 ' + n + ' 个选项，每人最多可设 ' + capacity + ' 票' +
    (selfVote ? '（允许投自己）' : '（不允许投自己，每人会少掉与自己同名的那一项）') +
    (q > capacity ? ' — 当前设置 ' + q + ' 票已超上限，创建会被拒绝。' : '');
  tip.style.color = q > capacity ? 'var(--danger)' : '';
}

document.getElementById('options-wrap').addEventListener('input', updateQuotaTip);
document.getElementById('votes-per-voter').addEventListener('input', updateQuotaTip);
document.querySelectorAll('input[name=allow_self_vote]').forEach(function (r) {
  r.addEventListener('change', updateQuotaTip);
});
updateQuotaTip();
</script>
{% endblock %}
